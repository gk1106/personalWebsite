spring:
  datasource:
    # Safe, local-only defaults — a dedicated low-privilege dev role/database,
    # never a superuser and never a value used anywhere outside localhost.
    url: ${DB_URL:jdbc:postgresql://localhost:5432/portfolio_dev}
    username: ${DB_USERNAME:portfolio_dev}
    password: ${DB_PASSWORD:portfolio_dev}
  jpa:
    show-sql: true

  ai:
    openai:
      # Dev/CI-only placeholder — never a real key. Spring AI's OpenAI
      # autoconfiguration needs a non-blank api-key to build its client bean
      # at startup, but nothing in dev or in the test suite ever calls the
      # real OpenAI API (the chat layer is mocked in tests), so this value
      # never needs to work — it just needs to exist so the context loads
      # without OPENAI_API_KEY being set. Prod has no default (see
      # application-prod.yml) and fails fast without a real key.
      api-key: ${OPENAI_API_KEY:sk-dev-placeholder-not-a-real-openai-key}

app:
  jwt:
    # Dev-only fallback — long enough for HS256 (>=32 bytes) but must never
    # be used outside local development. Prod has no default (see
    # application-prod.yml) and fails fast without an explicit JWT_SECRET.
    secret: ${JWT_SECRET:dev-only-jwt-secret-not-for-production-please-change-1234567890}

logging:
  level:
    com.gk.portfolio: DEBUG
