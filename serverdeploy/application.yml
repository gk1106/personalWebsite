spring:
  application:
    name: portfolio-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  jpa:
    hibernate:
      # Flyway is the single source of truth for schema — Hibernate only
      # verifies the entities match it. Never create/create-drop here.
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          # Persist/read all timestamps as UTC regardless of the JVM's local
          # timezone; convert to IST (or whatever's needed) at presentation
          # time instead of relying on server-local time.
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration

  jackson:
    time-zone: UTC

  ai:
    openai:
      chat:
        options:
          # Not a secret — just which OpenAI model the portfolio assistant
          # calls. The API key itself is configured per-profile below,
          # alongside the other required/optional secrets.
          model: ${OPENAI_MODEL:gpt-4o-mini}

server:
  port: ${SERVER_PORT:8080}

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

  # Same behavior in every environment: bootstrap is opt-in and requires
  # both variables explicitly set (no default password anywhere, dev
  # included) — see AdminBootstrapRunner. Blank means "bootstrap disabled."
  admin-bootstrap:
    username: ${ADMIN_USERNAME:postgres}
    password: ${ADMIN_PASSWORD:admin}

  jwt:
    # Not a secret — a reasonable default expiry for an admin-only session,
    # usable in prod as-is if ops doesn't need a different value there.
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:60}

logging:
  level:
    root: INFO
    com.gk.portfolio: INFO
    org.hibernate.SQL: WARN
