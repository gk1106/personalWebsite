name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend (lint + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Ganeshkumar
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: Ganeshkumar/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run build

  backend:
    name: Backend (test + package)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    # Ephemeral Postgres for this job only — matches application-dev.yml's
    # own baked-in defaults (db/user/password all "portfolio_dev" on the
    # default port), so no DB_URL/DB_USERNAME/DB_PASSWORD or any other
    # secret needs to be configured here. Never Supabase, never production
    # credentials.
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: portfolio_dev
          POSTGRES_USER: portfolio_dev
          POSTGRES_PASSWORD: portfolio_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U portfolio_dev -d portfolio_dev"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"
          cache: "maven"
          cache-dependency-path: backend/pom.xml

      - name: Make mvnw executable
        run: chmod +x mvnw

      # Runs the full real test suite (see backend/README.md's Tests
      # section — these are genuine integration tests against the Postgres
      # service above, not mocked) and packages the jar in one step, since
      # `package` already runs `test` first unless skipped — which it isn't.
      - name: Test and package
        run: ./mvnw -B clean package
