spring:
  datasource:
    # No defaults on purpose — startup must fail fast if these aren't set
    # explicitly in the production environment.
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    show-sql: false
  flyway:
    # Render cold starts can race a transient SSL handshake failure against
    # Supabase's Session Pooler on Flyway's very first connection attempt at
    # startup (observed: "SSL error: Remote host terminated the handshake").
    # A handful of short retries absorbs that without masking a real
    # misconfiguration — if the database is genuinely unreachable or the
    # credentials are wrong, this still fails after ~25s, not silently hangs.
    # Prod only: a transient cold-start blip isn't expected locally.
    connect-retries: 5
    connect-retries-interval: 5s

app:
  jwt:
    # No default on purpose — startup must fail fast without an explicit,
    # production-grade JWT_SECRET (at least 32 bytes for HS256).
    secret: ${JWT_SECRET}
  cors:
    # No trailing slash — the browser's Origin header never includes one, so
    # a trailing slash here would silently never match and break CORS.
    allowed-origins: ${CORS_ALLOWED_ORIGINS:https://ganeshkumarv.vercel.app}

logging:
  level:
    root: WARN
    com.gk.portfolio: INFO
