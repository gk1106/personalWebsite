# Explicit project name — prevents this stack's network/volume/container
# names from colliding with any other docker-compose project that also
# happens to be run from a directory named "backend".
name: portfolio-backend

services:
  db:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-Gkportfolio}
      POSTGRES_USER: ${POSTGRES_USER:-Gkportfolio}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-Gkportfolio}
    volumes:
      # Postgres 18+ images store data under version-specific subdirectories
      # and expect the volume mounted one level up from "data" — mounting at
      # .../data directly (the pre-18 convention) makes the image refuse to
      # start against it.
      - postgres_data:/var/lib/postgresql
    # ports:
    #   - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-Gkportfolio} -d ${POSTGRES_DB:-Gkportfolio}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    image: eclipse-temurin:17-jre-jammy
    restart: unless-stopped
    working_dir: /app
    command: ["java", "-jar", "/app/portfolio-backend.jar"]

    volumes:
      - ./portfolio-backend.jar:/app/portfolio-backend.jar:ro
      - ./application-prod.yml:/app/config/application-prod.yml:ro

    depends_on:
      db:
        condition: service_healthy
    environment:
      # Flyway owns the schema either way — see application-*.yml — so this
      # just picks which profile's logging/defaults apply. Defaults to prod
      # since this compose file is meant for a real deployment; everything
      # genuinely secret below is required (:?), not defaulted.
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      SPRING_CONFIG_ADDITIONAL_LOCATION: file:/app/config/

      DB_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-portfolio}
      DB_USERNAME: ${POSTGRES_USER:-Gkportfolio}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-Gkportfolio}
      SERVER_PORT: ${SERVER_PORT:-8080}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-\
        https://gkbuilds.in,\
        https://ganeshkumarv.vercel.app,\
        http://localhost:8080,\
        http://}
      JWT_SECRET: ${JWT_SECRET:-90869e3a559fb73ba6b9fd0395f89e455a082a846b6cb221c711bdba8a9fec8a}
      JWT_EXPIRATION_MINUTES: ${JWT_EXPIRATION_MINUTES:-60}
      JAVA_TOOL_OPTIONS: "-Xms128m -Xmx768m"
      # Admin bootstrap is opt-in — both-or-neither, enforced by the app
      # itself (AdminBootstrapRunner), never a default credential here.
      ADMIN_USERNAME: ${ADMIN_USERNAME:-Gkadmin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-Gkadmin}
    ports:
      - "127.0.0.1:8080:8080"

    mem_limit: 1200m

volumes:
  postgres_data: